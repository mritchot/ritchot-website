  - Instructional Design (ADDIE)
  - Inquiry & Project-Based Learning
  - Interdisciplinary Program Design
  - Academic Integrity
  - Learning Analytics
  - Design-Based Research

featured:
  title: AI Literacy for the Modern Workforce
  links:
    - label: View the full program
      url: https://ai-literacy.ritchot.me/
    - label: View the source code
      url: https://github.com/mritchot/ai-literacy-platform
  bullets:
    - >-
      Designed a four-module, 37-section learning program with 12 practice
      activities, pre/post competency assessments, and adaptive
      sequencing, applying ADDIE methodology and Anthropic's 4D competency
      framework (Delegation, Description, Discernment, Diligence) as an
      organizing taxonomy.
    - >-
      Engineered and deployed the delivery platform end to end (React,
      TypeScript, Tailwind CSS) on Cloudflare Pages, building interactive
      demonstrations of LLM mechanics — client-side BPE tokenization and
      real softmax-with-temperature probability visualizations — that make
      abstract model behavior directly observable to learners.
    - >-
      Built the learning analytics layer: xAPI-aligned event tracking,
      active reading time measurement, and an administrator dashboard
      surfacing live learner data for instructional decision-making.
    - >-
      Established a Kirkpatrick Levels 1–4 evaluation framework: a
      reaction-survey item bank, a ten-item parallel-form pre/post
      assessment, twelve behavioral transfer indicators on 30/60/90-day
      intervals, and a Phillips-methodology ROI model.
    - >-
      Grounded the program in a structured needs analysis using action
      mapping and learner persona development, then delivered the full
      development cycle solo in approximately 210 hours — a 71% reduction
      against the Chapman Alliance industry baseline of roughly 735 hours
      for comparable Level-3 e-learning.

