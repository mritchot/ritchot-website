name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the page-dates --check gate verifies committed dates
      # against git log, and passes vacuously on shallow clones — including
      # the deploy's. This job is where that gate actually binds.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # resume:pdf does not run here; skip Playwright's browser download.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build
