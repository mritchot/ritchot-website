summary: >-
  International educator with over 10 years of classroom experience across
  four countries, spanning MYP Design, Mathematics, Computer Science, and
  Sciences. Built a parallel track in educational technology leadership:
  digital learning ecosystems, emergent technology integration, and staff
  professional development. Designs, builds, and evaluates learning
  systems end to end: designed and evaluated an asynchronous e-learning
  module teaching AI literacy through the mechanics of large language
  models, improving assessment scores 28 points pre-to-post (62% to 90%)
  through a Design-Based Research methodology, then extended the work into
  a four-module program delivered on a custom-engineered platform. Led
  school-wide technology implementations including an enterprise LMS
  rollout and an organization-wide knowledge management system scaled from
  a single-department pilot to mandated division-wide use. Experienced in
  constructing interdisciplinary, inquiry-driven learning experiences
  grounded in constructionist and behaviorist approaches, and in embedding
  generative AI into curriculum design, assessment, and academic integrity
  practice. Committed to purposeful technology integration, collaboration,
  and the continuous evolution of teaching and learning.

